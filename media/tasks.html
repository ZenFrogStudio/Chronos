<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{cspSource}}; script-src 'nonce-{{nonce}}'; img-src {{cspSource}} data:; font-src {{cspSource}};"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="{{codiconUri}}" rel="stylesheet" />
    <link href="{{styleUri}}" rel="stylesheet" />
    <title>Tasks</title>
  </head>
  <body>
    <div id="add" class="add">
      <input id="task-input" class="task-field" type="text" placeholder="What needs doing?" aria-label="New task" />
      <button id="add-task" class="button" type="button">Add</button>
    </div>

    <div id="task-list" class="task-list"></div>

    <p id="empty" class="empty" hidden>
      No tasks yet. Add one above, or schedule a Markdown plan from the manager.
    </p>

    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
  </body>
</html>
